name: CI

# Every step is a `just` recipe (see justfile), so CI and local runs are the same commands.
# Push / PR: clippy and tests per crate group on Linux, all tests on macOS and on
# Windows (one job each), and the `misc` checks. By hand (Actions -> CI -> Run workflow):
# with an empty version, MSRV toolchains, minimal versions, vld feature pairs, latest
# stable clippy; with a version, the release (bump, tag, crates.io, GitHub release).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Run workflow: empty `release` runs the extended checks; a version (e.g. 0.8.0)
  # releases it (the `release` job; PUBLISHING.md).
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, e.g. 0.8.0 (no leading v). Empty: extended checks."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # A manual run may be a release: never cancel it.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so new clippy lints / rustdoc checks cannot break CI unannounced; the
  # extended job's latest-stable clippy warns about them early. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # Linux: clippy (all features, each feature alone) and tests per crate group
  # (ARCHITECTURE.md). openapi and app are small and share a job.
  linux:
    name: ${{ matrix.groups }}
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        groups: [core, web, data, openapi app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # diesel postgres / mysql backends link libpq / libmysqlclient.
      - if: matrix.groups == 'data'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libmysqlclient-dev
      # vld::ts cross-checks generated Zod 3 / Zod 4 / Valibot code under node.
      - if: matrix.groups == 'core'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: matrix.groups == 'core'
        run: |
          dir="$RUNNER_TEMP/ts-check"
          mkdir -p "$dir" && cd "$dir" && echo '{"private":true}' > package.json
          npm install --no-audit --no-fund zod@4 valibot@1
          echo "VLD_TS_NODE_DIR=$dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: ${{ matrix.groups == 'core' && 'wasm32-unknown-unknown' || '' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.groups }}
      - run: for g in ${{ matrix.groups }}; do just lint-group "$g"; done
      - if: ${{ !cancelled() }}
        run: for g in ${{ matrix.groups }}; do just test-group "$g"; done
      - if: matrix.groups == 'core' && !cancelled()
        run: just wasm

  # Every group's tests on macOS and Windows, one job per OS (paths, files, line
  # endings, sockets differ). vld-data runs without postgres / mysql there (justfile
  # `data_portable`).
  os:
    name: tests on ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just test

  misc:
    name: fmt, docs, deny, package, fuzz, playground
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustdoc builds vld-data with every feature: diesel links libpq / libmysqlclient.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-shear
      - uses: Swatinem/rust-cache@v2
      # Later steps run even if an earlier one failed, so one run shows every failure.
      - run: just fmt
      - if: ${{ !cancelled() }}
        run: cargo shear
      - if: ${{ !cancelled() }}
        run: just docs
      - if: ${{ !cancelled() }}
        run: just deny
      - if: ${{ !cancelled() }}
        run: just package
      - if: ${{ !cancelled() }}
        run: just fuzz
      - if: ${{ !cancelled() }}
        run: just playground

  # Slow or rarely-breaking checks, by hand before a release.
  extended:
    name: Extended
    if: github.event_name == 'workflow_dispatch' && inputs.release == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain resolves the probes' lockfiles; the listed ones (MSRV.md) build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: |
          for tc in 1.85 1.88 1.94 1.96 1.97; do rustup toolchain install "${tc}" --profile minimal; done
          rustup toolchain install nightly --profile minimal
          rustup toolchain install stable --profile minimal --component clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: just msrv
      - if: ${{ !cancelled() }}
        run: just powerset
      - name: just minimal (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just minimal
      - name: clippy on latest stable (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo +stable clippy --workspace --all-features --all-targets --profile ci --locked -- -D warnings

  # Release X.Y.Z (Run workflow with a version):
  # 1. checks CI: green on `main` HEAD, or on an earlier commit with only docs / *.md /
  #    justfile changed since;
  # 2. `just release-prep X.Y.Z`: every crate's version, the lockfiles, [Unreleased] ->
  #    [X.Y.Z] in CHANGELOG.md (fails when [Unreleased] is empty); `just semver`;
  # 3. commits `chore: release vX.Y.Z` to `main`, tags `vX.Y.Z`;
  # 4. publishes the crates with crates.io trusted publishing (no stored token);
  # 5. creates the GitHub release from the CHANGELOG.md section.
  # Re-running with the same version resumes once the tag exists: it publishes only what
  # is not on crates.io yet and creates the GitHub release if missing.
  release:
    name: release v${{ inputs.release }}
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    runs-on: ubuntu-latest
    # crates.io trusted publishers are configured for workflow `ci.yml`,
    # environment `crates-io`.
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Version and state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'${VERSION}' is not a version like 0.8.0"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} exists: resuming (publish + GitHub release only)"
            git checkout -q "v${VERSION}"
            echo "resume=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest `main` commit with a green CI run; after it only docs, *.md and the
          # justfile may have changed (the release runs the recipes it needs itself).
          green=""
          for c in $(git rev-list --first-parent -n 50 HEAD); do
            status="$(gh run list --workflow CI --commit "${c}" --event push --json conclusion --jq '.[0].conclusion // "none"')"
            if [[ "${status}" == success ]]; then green="${c}"; break; fi
          done
          [[ -n "${green}" ]] || { echo "::error::no green CI run among the last 50 main commits"; exit 1; }
          code="$(git diff --name-only "${green}" HEAD | grep -vE '^(docs/|justfile$|LICENSE$)|\.md$' || true)"
          if [[ -n "${code}" ]]; then
            echo "::error::CI is not green for these changes since ${green:0:7}: ${code//$'\n'/ }; wait for CI on main"
            exit 1
          fi
          echo "CI green on ${green:0:7}; changed since: $(git diff --name-only "${green}" HEAD | tr '\n' ' ')"
          echo "resume=false" >> "$GITHUB_OUTPUT"
      # diesel postgres / mysql (vld-data rustdoc for semver-checks) link libpq / libmysqlclient.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
      - name: Bump, changelog, semver
        if: steps.state.outputs.resume != 'true'
        run: |
          just release-prep "${VERSION}"
          just semver
          just package --allow-dirty
      - name: Commit and tag
        if: steps.state.outputs.resume != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # dependency order; a crate already at this version is skipped (resume)
          for c in vld-derive vld vld-openapi vld-web vld-data vld-app; do
            if cargo info --registry crates-io "${c}@${VERSION}" >/dev/null 2>&1; then
              echo "${c} ${VERSION} already on crates.io"
            else
              cargo publish -p "${c}" --locked
            fi
          done
      - name: GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "GitHub release v${VERSION} exists"; exit 0; fi
          just release-notes "${VERSION}" > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" --title "v${VERSION}" --latest --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "v${VERSION}" --json body --jq .body | head -5
