name: CI

# Every step is a `just` recipe (see justfile), so CI and local runs are the same commands.
# Push / PR: one job. Weekly and on demand (Actions -> CI -> Run workflow): the slow or
# rarely-breaking checks (MSRV toolchains, Windows/macOS, minimal versions, wasm, vld
# feature pairs, latest stable clippy).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so new clippy lints / rustdoc checks cannot break CI unannounced; the
  # weekly latest-stable step warns about them early. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  check:
    name: Check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # diesel postgres / mysql backends link libpq / libmysqlclient.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libmysqlclient-dev
      # vld-ts cross-checks generated Zod/Valibot code against vld under node.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          dir="$RUNNER_TEMP/ts-check"
          mkdir -p "$dir" && cd "$dir" && echo '{"private":true}' > package.json
          npm install --no-audit --no-fund zod@3 valibot@1
          echo "VLD_TS_NODE_DIR=$dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack,cargo-deny
      - uses: Swatinem/rust-cache@v2
      # Later steps run even if an earlier one failed, so one run shows every failure.
      - run: just fmt
      - if: ${{ !cancelled() }}
        run: just lint
      - if: ${{ !cancelled() }}
        run: just test
      - if: ${{ !cancelled() }}
        run: just docs
      - if: ${{ !cancelled() }}
        run: just deny
      - if: ${{ !cancelled() }}
        run: just package
      - if: ${{ !cancelled() }}
        run: just fuzz
      - if: ${{ !cancelled() }}
        run: just playground

  extended:
    name: Extended
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain resolves the probes' lockfiles; the listed ones (MSRV.md) build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - run: |
          for tc in 1.85 1.88 1.94 1.96 1.97; do rustup toolchain install "${tc}" --profile minimal; done
          rustup toolchain install nightly --profile minimal
          rustup toolchain install stable --profile minimal --component clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: just msrv
      - if: ${{ !cancelled() }}
        run: just wasm
      - if: ${{ !cancelled() }}
        run: just powerset
      - name: just minimal (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just minimal
      - name: clippy on latest stable (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo +stable clippy --workspace --all-targets --profile ci --locked -- -D warnings

  # Path / file containment (ZPath::within, ZFile::within) is OS-sensitive.
  os:
    name: vld on ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vld --features file,file-advanced,string-advanced --locked
