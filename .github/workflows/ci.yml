name: CI

# Every step is a `just` recipe (see justfile), so CI and local runs are the same commands.
# Push / PR: clippy and tests per crate group on Linux, all tests on macOS and on
# Windows (one job each), and the `misc` checks. On `main`, once all of them pass, `release` publishes
# what a merged release PR bumped (release-plz; PUBLISHING.md). By hand (Actions -> CI ->
# Run workflow): MSRV toolchains, minimal versions, vld feature pairs, latest stable clippy.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a `main` run: its `release` job may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so new clippy lints / rustdoc checks cannot break CI unannounced; the
  # extended job's latest-stable clippy warns about them early. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # Linux: clippy (all features, each feature alone) and tests per crate group
  # (ARCHITECTURE.md). openapi and app are small and share a job.
  linux:
    name: ${{ matrix.groups }}
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        groups: [core, web, data, openapi app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # diesel postgres / mysql backends link libpq / libmysqlclient.
      - if: matrix.groups == 'data'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libmysqlclient-dev
      # vld::ts cross-checks generated Zod 3 / Zod 4 / Valibot code under node.
      - if: matrix.groups == 'core'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: matrix.groups == 'core'
        run: |
          dir="$RUNNER_TEMP/ts-check"
          mkdir -p "$dir" && cd "$dir" && echo '{"private":true}' > package.json
          npm install --no-audit --no-fund zod@4 valibot@1
          echo "VLD_TS_NODE_DIR=$dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: ${{ matrix.groups == 'core' && 'wasm32-unknown-unknown' || '' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.groups }}
      - run: for g in ${{ matrix.groups }}; do just lint-group "$g"; done
      - if: ${{ !cancelled() }}
        run: for g in ${{ matrix.groups }}; do just test-group "$g"; done
      - if: matrix.groups == 'core' && !cancelled()
        run: just wasm

  # Every group's tests on macOS and Windows, one job per OS (paths, files, line
  # endings, sockets differ). vld-data runs without postgres / mysql there (justfile
  # `data_portable`).
  os:
    name: tests on ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just test

  misc:
    name: fmt, docs, deny, package, fuzz, playground
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustdoc builds vld-data with every feature: diesel links libpq / libmysqlclient.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-shear
      - uses: Swatinem/rust-cache@v2
      # Later steps run even if an earlier one failed, so one run shows every failure.
      - run: just fmt
      - if: ${{ !cancelled() }}
        run: cargo shear
      - if: ${{ !cancelled() }}
        run: just docs
      - if: ${{ !cancelled() }}
        run: just deny
      - if: ${{ !cancelled() }}
        run: just package
      - if: ${{ !cancelled() }}
        run: just fuzz
      - if: ${{ !cancelled() }}
        run: just playground

  # Publish after a green `main` run: release-plz publishes the crates whose version is not
  # on crates.io yet (that is, after a release PR was merged) and tags `vX.Y.Z`; the GitHub
  # release body is that version's CHANGELOG.md section. Otherwise it does nothing.
  release:
    name: release
    needs: [linux, os, misc]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # push the tag, create the GitHub release
      contents: write
      # crates.io trusted publishing (OIDC)
      id-token: write
      pull-requests: read
    env:
      # A crates.io token is only needed for a crate's first version (trusted publishing
      # cannot create crates); without the secret release-plz uses trusted publishing.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - id: token
        if: env.HAS_TOKEN == 'true'
        name: release (crates.io token)
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - id: trusted
        if: env.HAS_TOKEN != 'true'
        name: release (trusted publishing)
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GitHub release from CHANGELOG.md
        env:
          RELEASES: ${{ steps.token.outputs.releases || steps.trusted.outputs.releases }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(echo "${RELEASES:-[]}" | jq -r '.[] | select(.package_name == "vld") | .version')"
          if [[ -z "${version}" ]]; then echo "nothing released"; exit 0; fi
          just release-notes "${version}" > "$RUNNER_TEMP/notes.md"
          gh release create "v${version}" --title "v${version}" --latest --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "v${version}" --json body --jq .body | head -5

  # Slow or rarely-breaking checks, by hand before a release.
  extended:
    name: Extended
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain resolves the probes' lockfiles; the listed ones (MSRV.md) build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: |
          for tc in 1.85 1.88 1.94 1.96 1.97; do rustup toolchain install "${tc}" --profile minimal; done
          rustup toolchain install nightly --profile minimal
          rustup toolchain install stable --profile minimal --component clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: just msrv
      - if: ${{ !cancelled() }}
        run: just powerset
      - name: just minimal (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: just minimal
      - name: clippy on latest stable (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo +stable clippy --workspace --all-features --all-targets --profile ci --locked -- -D warnings
