name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so new clippy lints / rustdoc checks cannot break CI unannounced;
  # the `latest-stable` job warns about them early. Bump deliberately.
  RUST_TOOLCHAIN: "1.99.1"
  # Keep target/ for Swatinem/rust-cache (ci-all.sh deletes only its own
  # default target/ci).
  CARGO_TARGET_DIR: target

jobs:
  # Each job runs one group of scripts/ci-all.sh, so a failure in one area
  # does not hide the others and local runs use the same script.
  test:
    name: Build + test (workspace, doctests, playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-all.sh test playground

  features:
    name: vld feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-all.sh features

  # Path / file containment (ZPath::within, ZFile::within) is OS-sensitive.
  os:
    name: vld file/path tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vld --features file,file-advanced,string-advanced --locked

  integrations:
    name: Integration crates (dual-major features, DB backends, live redis/rabbitmq)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      AMQP_URL: amqp://guest:guest@127.0.0.1:5672/%2f
    steps:
      - uses: actions/checkout@v5
      # diesel postgres / mysql backends link libpq / libmysqlclient.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-all.sh integrations

  clippy:
    name: Clippy + rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-all.sh fmt clippy

  docs:
    name: Docs (rustdoc -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-all.sh docs

  msrv:
    name: MSRV (core on 1.85 with all features, every crate on its rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The default toolchain resolves the MSRV-aware lockfiles; the listed
      # toolchains (MSRV.md) build. Keep in sync with group_msrv.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: |
          for tc in 1.85 1.88 1.94 1.96 1.97; do
            rustup toolchain install "${tc}" --profile minimal
          done
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: bash scripts/ci-all.sh msrv

  minimal-versions:
    name: Minimal direct dependency versions (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimal-versions
      - run: bash scripts/ci-all.sh minimal

  package:
    name: Package dry run (what cargo publish uploads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: bash scripts/ci-all.sh package

  fuzz:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
      - run: bash scripts/ci-all.sh fuzz

  wasm:
    name: wasm32 check (vld, vld-leptos, vld-dioxus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: bash scripts/ci-all.sh wasm

  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # --workspace: without it only the root `vld` package is checked.
          arguments: --workspace --all-features
          command: check

  latest-stable:
    name: Clippy on latest stable (early warning, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: latest-stable
      - run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
