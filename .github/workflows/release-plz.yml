name: Release PR

# On every push to `main`, release-plz opens or updates the release PR: every crate
# bumped to the next version (one version for all, release-plz.toml). This workflow then
# renames `## [Unreleased]` in CHANGELOG.md on the PR branch and checks the public API
# against crates.io (`just semver`). Merging the PR releases: the CI `release` job
# publishes once CI is green on `main`. PUBLISHING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  release-pr:
    name: release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-semver-checks
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: CHANGELOG.md and fuzz/Cargo.lock on the release PR
        id: prep
        if: steps.release-plz.outputs.prs != '' && steps.release-plz.outputs.prs != '[]'
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="$(echo "${PR}" | jq -r .head_branch)"
          version="$(echo "${PR}" | jq -r '.releases[] | select(.package_name == "vld") | .version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          git fetch origin "${branch}"
          git switch "${branch}"
          just release-prep "${version}"
          if git diff --quiet; then echo "already prepared"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: changelog for v${version}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${branch}"
      # Fails the run (and so shows on the release PR's base commit) when the API changed
      # more than the version bump allows.
      - name: semver-checks against crates.io
        if: steps.release-plz.outputs.prs != '' && steps.release-plz.outputs.prs != '[]'
        run: |
          # rustdoc of vld-data with every feature: diesel links libpq / libmysqlclient
          sudo apt-get update >/dev/null && sudo apt-get install -y --no-install-recommends libpq-dev libmysqlclient-dev >/dev/null
          just semver
