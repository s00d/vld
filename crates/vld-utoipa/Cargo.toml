[package]
name = "vld-utoipa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "utoipa integration for the vld validation library — auto-generate OpenAPI schemas from vld definitions"
documentation = "https://docs.rs/vld-utoipa"
readme = "README.md"
keywords = ["validation", "utoipa", "openapi", "schema", "vld"]
categories = ["web-programming", "development-tools"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[features]
default = ["utoipa-5"]
utoipa-5 = ["dep:utoipa"]
utoipa-6 = ["dep:utoipa6"]

[dependencies]
vld = { workspace = true, features = ["openapi"] }
utoipa = { version = "5", optional = true }
utoipa6 = { package = "utoipa", version = "6", optional = true }
serde_json = { workspace = true }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
serde = { workspace = true }
vld = { workspace = true, features = ["openapi", "derive"] }

[[example]]
name = "utoipa_basic"
path = "examples/utoipa_basic.rs"
# `#[utoipa::path]` / `OpenApi` macros require the crate to be named `utoipa`
# (utoipa-5 feature). utoipa-6 is covered by lib + integration tests.
required-features = ["utoipa-5"]

[package.metadata.docs.rs]
# One major per dual-major crate (they are mutually exclusive): the newest.
no-default-features = true
features = ["utoipa-6"]
