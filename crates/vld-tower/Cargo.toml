[package]
name = "vld-tower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tower middleware for vld — validate HTTP request bodies in any Tower-compatible framework"
documentation = "https://docs.rs/vld-tower"
readme = "README.md"
keywords = ["validation", "tower", "middleware", "http", "vld"]
categories = ["web-programming", "web-programming::http-server"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[dependencies]
vld = { workspace = true }
vld-http-common = { workspace = true }
tower-layer = "0.3"
tower-service = "0.3"
http = { workspace = true }
http-body = "1"
http-body-util = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
vld-http-common = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
tower = { workspace = true, features = ["util"] }
axum = { workspace = true }
serde = { workspace = true }
vld = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "tower_basic"
path = "examples/tower_basic.rs"

[[example]]
name = "tower_axum"
path = "examples/tower_axum.rs"
