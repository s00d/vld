[package]
name = "vld-sea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SeaORM integration for the vld validation library — validate ActiveModel before insert/update"
documentation = "https://docs.rs/vld-sea"
readme = "README.md"
keywords = ["validation", "sea-orm", "orm", "activemodel", "database"]
categories = ["web-programming", "database"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[features]
default = ["sea-orm-1"]
sea-orm-1 = ["dep:sea-orm"]
sea-orm-2 = ["dep:sea-orm2"]
# Map these SeaORM column types to JSON for `validate_active` / `before_save`
# (also enables the matching SeaORM feature).
with-json = ["sea-orm?/with-json", "sea-orm2?/with-json"]
with-chrono = ["sea-orm?/with-chrono", "sea-orm2?/with-chrono"]
with-uuid = ["sea-orm?/with-uuid", "sea-orm2?/with-uuid"]
with-rust_decimal = ["sea-orm?/with-rust_decimal", "sea-orm2?/with-rust_decimal"]
with-bigdecimal = ["sea-orm?/with-bigdecimal", "sea-orm2?/with-bigdecimal"]
with-time = ["sea-orm?/with-time", "sea-orm2?/with-time"]
postgres-array = ["sea-orm?/postgres-array", "sea-orm2?/postgres-array"]

[dependencies]
vld = { workspace = true }
sea-orm = { version = "1", default-features = false, optional = true }
sea-orm2 = { package = "sea-orm", version = "2", default-features = false, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
vld-integration-common = { workspace = true }

[dev-dependencies]
vld = { workspace = true }
# Entity derive macros emit `sea_orm::` paths: tests/integration.rs runs on
# sea-orm 1, tests/sea_orm2.rs aliases `sea_orm2 as sea_orm`.
sea-orm = { version = "1", default-features = false, features = ["macros"] }
sea-orm2 = { package = "sea-orm", version = "2", default-features = false, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
time = "0.3"

[[example]]
name = "sea_basic"
path = "examples/sea_basic.rs"
required-features = ["sea-orm-1"]

[package.metadata.docs.rs]
# One major per dual-major crate (they are mutually exclusive): the newest.
no-default-features = true
features = ["sea-orm-2", "with-json", "with-chrono", "with-uuid", "with-rust_decimal", "with-bigdecimal"]
