[package]
name = "vld-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Axum integration for the vld validation library"
documentation = "https://docs.rs/vld-axum"
readme = "README.md"
keywords = ["validation", "axum", "web", "json", "extractor"]
categories = ["web-programming", "web-programming::http-server"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[dependencies]
vld = { workspace = true }
vld-http-common = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }

[dev-dependencies]
vld-http-common = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
vld = { workspace = true, features = ["openapi"] }
vld-utoipa = { workspace = true }
utoipa = { version = "5" }

[[example]]
name = "axum_basic"
path = "examples/axum_basic.rs"

[[example]]
name = "axum_openapi"
path = "examples/axum_openapi.rs"
