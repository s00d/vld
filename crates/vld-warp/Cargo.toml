[package]
name = "vld-warp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Warp integration for the vld validation library"
documentation = "https://docs.rs/vld-warp"
readme = "README.md"
keywords = ["validation", "warp", "web", "json", "filter"]
categories = ["web-programming", "web-programming::http-server"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
vld = { workspace = true }
vld-http-common = { workspace = true }
warp = { version = ">=0.3, <0.5" }
serde_json = { workspace = true }
bytes = "1.5"
futures-util = { version = "0.3.28", default-features = false }

[dev-dependencies]
vld-http-common = { workspace = true, features = ["conformance"] }
vld = { workspace = true }
warp = { version = "0.4", features = ["server", "test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde = { workspace = true }

[[example]]
name = "warp_basic"
path = "examples/warp_basic.rs"
