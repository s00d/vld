[package]
name = "vld-dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dioxus helpers for the vld validation library — shared validation for server functions and WASM clients (framework-agnostic: no dioxus dependency)"
documentation = "https://docs.rs/vld-dioxus"
readme = "README.md"
keywords = ["validation", "dioxus", "wasm", "server-functions", "vld"]
categories = ["web-programming", "wasm"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[dependencies]
vld = { workspace = true }
vld-integration-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
vld = { workspace = true }

[[example]]
name = "dioxus_basic"
path = "examples/dioxus_basic.rs"
