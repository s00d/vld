[package]
name = "vld-rama"
version.workspace = true
edition.workspace = true
rust-version = "1.96"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rama integration for the vld validation library"
documentation = "https://docs.rs/vld-rama"
readme = "README.md"
keywords = ["validation", "rama", "web", "json", "extractor"]
categories = ["web-programming", "web-programming::http-server"]
exclude = [".idea/", "tests/", "examples/"]

[dependencies]
vld = { workspace = true }
vld-http-common = { workspace = true }
rama = { version = "0.4", default-features = false, features = ["http"] }
serde_json = { workspace = true }

[dev-dependencies]
vld-http-common = { workspace = true, features = ["conformance"] }
vld = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { workspace = true }

[[example]]
name = "rama_basic"
path = "examples/rama_basic.rs"
