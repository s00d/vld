[package]
name = "vld-diesel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Diesel integration for the vld validation library — validate before insert/update"
documentation = "https://docs.rs/vld-diesel"
readme = "README.md"
keywords = ["validation", "diesel", "orm", "database", "vld"]
categories = ["database", "web-programming"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[features]
default = ["sqlite"]
postgres = ["diesel/postgres"]
mysql = ["diesel/mysql"]
sqlite = ["diesel/sqlite"]

[dependencies]
vld = { workspace = true }
diesel = { version = "2", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
vld-integration-common = { workspace = true }

[dev-dependencies]
diesel = { version = "2", features = ["sqlite"] }
vld = { workspace = true }

[[example]]
name = "diesel_basic"
path = "examples/diesel_basic.rs"
required-features = ["sqlite"]

[[test]]
name = "integration"
required-features = ["sqlite"]

[package.metadata.docs.rs]
all-features = true
