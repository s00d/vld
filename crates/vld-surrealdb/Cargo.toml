[package]
name = "vld-surrealdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SurrealDB helpers for the vld validation library — validate JSON documents before create/insert/update and after select (SDK-agnostic: no surrealdb dependency)"
documentation = "https://docs.rs/vld-surrealdb"
readme = "README.md"
keywords = ["validation", "surrealdb", "database", "document", "vld"]
categories = ["database", "web-programming"]
exclude = [".idea/", "tests/", "examples/"]

[dependencies]
vld = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vld-integration-common = { path = "../vld-integration-common", version = "0.4.6" }

[dev-dependencies]
vld = { workspace = true }

[[example]]
name = "surrealdb_basic"
path = "examples/surrealdb_basic.rs"
