[package]
name = "vld-surrealdb"
version = "0.7.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DEPRECATED: moved to vld-data 0.8 (vld_data::surrealdb). SurrealDB helpers for the vld validation library — validate JSON documents before create/insert/update and after select (SDK-agnostic: no surrealdb dependency)"
documentation = "https://docs.rs/vld-surrealdb"
readme = "README.md"
keywords = ["validation", "surrealdb", "database", "document", "vld"]
categories = ["database", "web-programming"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[dependencies]
vld = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vld-integration-common = { workspace = true }

[dev-dependencies]
vld = { workspace = true }

[[example]]
name = "surrealdb_basic"
path = "examples/surrealdb_basic.rs"
