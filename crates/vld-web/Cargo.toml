[package]
name = "vld-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web framework integrations for the vld validation library: axum, actix-web, ntex, poem, Rocket, salvo, warp, rama, Tower, tonic"
documentation = "https://docs.rs/vld-web"
keywords = ["validation", "web", "http", "extractor", "vld"]
categories = ["web-programming", "web-programming::http-server"]
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[features]
default = []
axum = ["dep:axum", "dep:bytes", "dep:http"]
actix = ["dep:actix-web"]
ntex-3 = ["dep:ntex3"]
ntex-4 = ["dep:ntex4"]
# Decode `Content-Encoding: gzip/deflate/br` request bodies (ntex `compress`).
ntex-compress = ["ntex3?/compress", "ntex4?/compress"]
poem = ["dep:poem"]
rocket = ["dep:rocket"]
salvo = ["dep:salvo"]
warp = ["dep:warp", "dep:bytes", "dep:futures-util"]
rama = ["dep:rama"]
tower = ["dep:tower-layer", "dep:tower-service", "dep:http", "dep:http-body", "dep:http-body-util", "dep:bytes"]
tonic = ["dep:tonic"]

[dependencies]
vld = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Shared by several frameworks
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
# Frameworks
axum = { workspace = true, optional = true }
actix-web = { version = "4.4", optional = true }
ntex3 = { package = "ntex", version = "3", default-features = false, optional = true }
ntex4 = { package = "ntex", version = "4", default-features = false, optional = true }
poem = { version = "3", optional = true }
rocket = { version = "0.5", default-features = false, features = ["json"], optional = true }
salvo = { version = "1", default-features = false, features = ["server", "http1", "cookie"], optional = true }
warp = { version = ">=0.3, <0.5", optional = true }
futures-util = { version = "0.3.28", default-features = false, optional = true }
rama = { version = "0.4", default-features = false, features = ["http"], optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { workspace = true, optional = true }
tonic = { version = ">=0.12, <0.15", default-features = false, optional = true }

# Test runtimes and framework test features; tests of a framework compile
# only with its feature.
[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tower = { workspace = true, features = ["util"] }
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
actix-rt = "2"
ntex3 = { package = "ntex", version = "3", default-features = false, features = ["tokio"] }
ntex4 = { package = "ntex", version = "4", default-features = false, features = ["tokio"] }
flate2 = "1"
poem = { version = "3", features = ["test"] }
rocket = { version = "0.5", features = ["json"] }
salvo = { version = "1", default-features = false, features = ["test", "server", "http1", "cookie"] }
warp = { version = "0.4", features = ["server", "test"] }
# axum_openapi example
vld = { workspace = true, features = ["openapi"] }
vld-openapi = { workspace = true, features = ["utoipa-5"] }
utoipa = "5"

[[example]]
name = "axum_basic"
required-features = ["axum"]

[[example]]
name = "axum_openapi"
required-features = ["axum"]

[[example]]
name = "actix_basic"
required-features = ["actix"]

[[example]]
name = "ntex_basic"
required-features = ["ntex-4"]

[[example]]
name = "poem_basic"
required-features = ["poem"]

[[example]]
name = "rocket_basic"
required-features = ["rocket"]

[[example]]
name = "salvo_basic"
required-features = ["salvo"]

[[example]]
name = "warp_basic"
required-features = ["warp"]

[[example]]
name = "rama_basic"
required-features = ["rama"]

[[example]]
name = "tower_basic"
required-features = ["tower"]

[[example]]
name = "tower_axum"
required-features = ["tower"]

[[example]]
name = "tonic_basic"
required-features = ["tonic"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
