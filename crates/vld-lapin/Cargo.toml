[package]
name = "vld-lapin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lapin (RabbitMQ) integration for the vld validation library — validate message payloads before publish and after consume"
documentation = "https://docs.rs/vld-lapin"
readme = "README.md"
keywords = ["validation", "lapin", "rabbitmq", "amqp", "vld"]
categories = ["web-programming"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[features]
default = ["lapin-2"]
lapin-2 = ["dep:lapin2"]
lapin-3 = ["dep:lapin3"]
lapin-4 = ["dep:lapin4"]

[dependencies]
vld = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lapin2 = { package = "lapin", version = "2", optional = true }
lapin3 = { package = "lapin", version = "3", optional = true }
lapin4 = { package = "lapin", version = "4.10", optional = true }

[dev-dependencies]
vld = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[example]]
name = "lapin_basic"
path = "examples/lapin_basic.rs"

[package.metadata.docs.rs]
# One major per dual-major crate (they are mutually exclusive): the newest.
no-default-features = true
features = ["lapin-4"]
