[package]
name = "vld-fake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Generate fake / test data from vld JSON Schemas"
documentation = "https://docs.rs/vld-fake"
readme = "README.md"
keywords = ["validation", "fake", "testing", "json-schema", "generator"]
categories = ["development-tools::testing", "parsing"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[dependencies]
vld = { workspace = true, features = ["openapi", "regex"] }
serde_json = { workspace = true }
rand = "0.10"
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
vld = { workspace = true, features = ["openapi", "chrono", "regex", "string-advanced", "decimal", "net"] }
serde = { workspace = true }
