[package]
name = "vld-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Redis integration for the vld validation library — validate payloads before set/publish and after get/subscribe"
documentation = "https://docs.rs/vld-redis"
readme = "README.md"
keywords = ["validation", "redis", "pubsub", "json", "vld"]
categories = ["database", "web-programming"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = ["redis-0"]
redis-0 = ["dep:redis"]
redis-1 = ["dep:redis1"]
# Async wrapper `AsyncRedisConn` over `redis::aio::ConnectionLike` (no runtime chosen).
aio = ["redis?/aio", "redis1?/aio"]
# `aio` plus redis' tokio runtime support (`tokio-comp`).
aio-tokio = ["aio", "redis?/tokio-comp", "redis1?/tokio-comp"]

[dependencies]
vld = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
redis = { version = ">=0.32, <1", optional = true }
redis1 = { package = "redis", version = ">=1, <2", optional = true }

[dev-dependencies]
vld = { workspace = true }
# A runtime for the `aio` tests (`aio` itself leaves the choice to the user).
redis = { version = ">=0.32, <1", features = ["tokio-comp"] }
redis1 = { package = "redis", version = ">=1, <2", features = ["tokio-comp"] }
tokio = { version = "1", features = ["rt", "macros"] }

[[example]]
name = "redis_basic"
path = "examples/redis_basic.rs"

[package.metadata.docs.rs]
# One major per dual-major crate (they are mutually exclusive): the newest.
no-default-features = true
features = ["redis-1", "aio"]
