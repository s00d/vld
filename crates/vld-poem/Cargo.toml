[package]
name = "vld-poem"
version = "0.7.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DEPRECATED: moved to vld-web 0.8 (vld_web::poem). Poem integration for the vld validation library"
documentation = "https://docs.rs/vld-poem"
readme = "README.md"
keywords = ["validation", "poem", "web", "json", "extractor"]
categories = ["web-programming", "web-programming::http-server"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[lints]
workspace = true

[dependencies]
vld = { workspace = true }
vld-http-common = { workspace = true }
poem = "3"
serde_json = { workspace = true }

[dev-dependencies]
vld-http-common = { workspace = true, features = ["conformance"] }
vld = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
poem = { version = "3", features = ["test"] }
serde = { workspace = true }

[[example]]
name = "poem_basic"
path = "examples/poem_basic.rs"
