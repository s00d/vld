[package]
name = "vld-aide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Alias of vld-schemars for aide users: re-exports impl_json_schema!/vld_to_schemars (no aide dependency)"
documentation = "https://docs.rs/vld-aide"
readme = "README.md"
keywords = ["validation", "aide", "openapi", "schemars", "vld"]
categories = ["web-programming", "development-tools"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = ["schemars-0"]
schemars-0 = ["vld-schemars/schemars-0"]
schemars-1 = ["vld-schemars/schemars-1"]

[dependencies]
vld = { workspace = true, features = ["openapi"] }
vld-schemars = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
vld = { workspace = true, features = ["openapi", "derive"] }
insta = { version = "1.49.0", features = ["json"] }

[[example]]
name = "aide_basic"
path = "examples/aide_basic.rs"

[package.metadata.docs.rs]
# One major per dual-major crate (they are mutually exclusive): the newest.
no-default-features = true
features = ["schemars-1"]
