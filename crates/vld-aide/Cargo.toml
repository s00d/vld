[package]
name = "vld-aide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "aide (schemars) integration for the vld validation library — auto-generate OpenAPI schemas for aide from vld definitions"
documentation = "https://docs.rs/vld-aide"
readme = "README.md"
keywords = ["validation", "aide", "openapi", "schemars", "vld"]
categories = ["web-programming", "development-tools"]
exclude = [".idea/", "tests/", "examples/"]

[features]
default = ["schemars-0"]
schemars-0 = ["vld-schemars/schemars-0"]
schemars-1 = ["vld-schemars/schemars-1"]

[dependencies]
vld = { workspace = true, features = ["openapi"] }
vld-schemars = { path = "../vld-schemars", version = "0.4.6", default-features = false }

[dev-dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
vld = { workspace = true, features = ["openapi", "derive"] }
insta = { version = "1.49.0", features = ["json"] }

[[example]]
name = "aide_basic"
path = "examples/aide_basic.rs"
