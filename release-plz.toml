# release-plz (https://release-plz.ieni.dev): the release-plz workflow opens a
# release PR on every push to `main`; merging it releases. PUBLISHING.md.

[workspace]
# CHANGELOG.md is written by hand under `## [Unreleased]`; the release PR
# workflow renames that section (`just release-prep`).
changelog_update = false
# `just semver` (every feature) runs in the release PR workflow instead: with
# no default features the built-in check would compare almost nothing.
semver_check = false
# 0.x: a `feat` commit bumps the minor version, like the releases so far.
features_always_increment_minor = true
# One tag and one GitHub release for the workspace, made by the `vld` package
# (the CI `release` job writes the GitHub release from CHANGELOG.md).
git_tag_enable = false
git_release_enable = false

[[package]]
name = "vld"
version_group = "vld"
git_tag_enable = true
git_tag_name = "v{{ version }}"

[[package]]
name = "vld-derive"
version_group = "vld"

[[package]]
name = "vld-web"
version_group = "vld"

[[package]]
name = "vld-openapi"
version_group = "vld"

[[package]]
name = "vld-data"
version_group = "vld"

[[package]]
name = "vld-app"
version_group = "vld"

[[package]]
name = "playground"
release = false
