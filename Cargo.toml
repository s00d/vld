[workspace]
members = [
    "crates/vld",
    "crates/vld-derive",
    "crates/vld-integration-common",
    "crates/vld-axum",
    "crates/vld-actix",
    "crates/vld-ts",
    "crates/vld-diesel",
    "crates/vld-utoipa",
    "crates/vld-config",
    "crates/vld-tower",
    "crates/vld-rocket",
    "crates/vld-poem",
    "crates/vld-warp",
    "crates/vld-sea",
    "crates/vld-clap",
    "crates/vld-salvo",
    "crates/vld-tauri",
    "crates/vld-fake",
    "crates/vld-http-common",
    "crates/vld-tonic",
    "crates/vld-leptos",
    "crates/vld-sqlx",
    "crates/vld-dioxus",
    "crates/vld-ntex",
    "crates/vld-aide",
    "crates/vld-surrealdb",
    "crates/vld-schemars",
    "crates/vld-redis",
    "crates/vld-lapin",
    "crates/vld-rama",
    "examples/playground",
]
exclude = ["fuzz"]
# "2", not edition 2024's "3": the lockfile is for development and CI and
# takes the newest releases (security fixes included). MSRV is checked by
# `just msrv` with per-crate lockfiles resolved for each rust-version.
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/s00d/vld"
homepage = "https://github.com/s00d/vld"

[workspace.dependencies]
# Internal crates
vld = { path = "crates/vld", version = "0.5.1" }
vld-derive = { path = "crates/vld-derive", version = "0.5.1" }
vld-http-common = { path = "crates/vld-http-common", version = "0.5.1" }
vld-integration-common = { path = "crates/vld-integration-common", version = "0.5.1" }
vld-utoipa = { path = "crates/vld-utoipa", version = "0.5.1" }
# default-features off: dependents pick the schemars major themselves.
vld-schemars = { path = "crates/vld-schemars", version = "0.5.1", default-features = false }

# Shared external
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Shared external (crates add their own features)
tokio = "1"
insta = { version = "1.49.0", features = ["json"] }
bytes = "1.5"
tower = "0.5"
regex-lite = "0.1.5"
http-body-util = "0.1"
http = "1"
axum = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# ---------------------------------------------------------------------------
# Profiles — keep `target/` from eating tens of GB
# ---------------------------------------------------------------------------
# This workspace pulls ~30 integration crates (actix/rocket/rama/salvo/sqlx…).
# Full debuginfo on every dependency is what balloons `target/debug` to 20–30G.
#
# - `dev`: line tables for workspace crates; no debuginfo for registry deps
# - `ci`:  no debuginfo, no incremental (`just` recipes; output in target/ci)
#
# `split-debuginfo = "off"`: on macOS the default ("unpacked") keeps every
# codegen unit's `.o` in `target/*/deps` for the debugger and cargo never
# deletes stale ones, so each rebuild of a test binary leaks ~170 objects
# (measured: +172 `.o` per edit of src/, >1 GB after a day of work). "off"
# embeds the line tables in the binary instead: no leftovers, no dsymutil.

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[profile.ci.package."*"]
debug = false
