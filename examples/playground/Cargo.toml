[package]
name = "playground"
version = "0.0.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["openapi", "diff"]
openapi = ["vld/openapi"]
diff = ["vld/diff"]

[dependencies]
vld = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Not released: cargo-release would otherwise bump and tag it (publish = false
# only stops `cargo publish`).
[package.metadata.release]
release = false
