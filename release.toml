# cargo-release configuration — how to release: PUBLISHING.md.
#
#   cargo release minor --workspace            # dry run
#   cargo release minor --workspace --execute
#
# cargo-release publishes the crates in dependency order by itself.

# Sign commits/tags
sign-commit = false
sign-tag = false

# Push to remote after release
push = true
push-remote = "origin"

# One commit and one tag (v<version>) for the whole workspace
tag = true
tag-prefix = "v"
tag-name = "{{prefix}}{{version}}"
consolidate-commits = true
tag-message = "Release {{crate_name}} v{{version}}"

# Commit message
pre-release-commit-message = "chore: release v{{version}}"

# Workspace-wide preflight + CHANGELOG run once from the root `vld` package hook
# (see [package.metadata.release] in Cargo.toml).

# Pre-release checks
verify = true

# Publish to crates.io
publish = true

# Releases only from these branches
allow-branch = ["master", "main"]

# Dependent version replacement — auto update `vld = { version = "X.Y.Z" }` everywhere
dependent-version = "upgrade"
