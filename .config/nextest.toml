# Per-test hard timeouts: a hung test is killed, not waited on. Models and stories take seconds.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

# cargo-mutants (.cargo/mutants.toml): a mutant can loop or allocate without bound, so kill early
# and leave cores free.
[profile.mutants]
slow-timeout = { period = "20s", terminate-after = 1 }
test-threads = 4
fail-fast = true
